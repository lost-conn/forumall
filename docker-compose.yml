# Forumall self-host stack: the app (single container, API + web client) behind
# Caddy for automatic HTTPS.
#
#   cp .env.example .env   # set DOMAIN (and optionally PORT)
#   docker compose up -d
#
# Caddy obtains + renews a Let's Encrypt cert for $DOMAIN automatically. For
# local testing without a public domain, see the commented http:// override in
# the Caddyfile.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: forumall:latest
    restart: unless-stopped
    environment:
      # Public authority for this provider (OFSCP `iss` / discovery domain).
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # In-container listen port; Caddy proxies to this. Not published to the
      # host directly — only Caddy is exposed.
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      MEDIA_DIR: /data/media
    volumes:
      # Named volume holds the SQLite db + uploaded media across restarts.
      - forumall_data:/data
    expose:
      - "${PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Consumed by the Caddyfile site block + reverse_proxy upstream.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      APP_UPSTREAM: app:${PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # ACME account + issued certificates (must persist)
      - caddy_config:/config

volumes:
  forumall_data:
  caddy_data:
  caddy_config:
